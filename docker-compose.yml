services:
  postgres:
    image: postgres:18-alpine
    container_name: memoria-viva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memoria_viva}
      POSTGRES_USER: ${POSTGRES_USER:-memoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoria_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - memoria_viva_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  memoria_viva_postgres:
